name: Test Deployment

on:
  push:
    branches:
      - test

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

    # ===================== CHECKOUT =====================
    - name: Checkout code
      uses: actions/checkout@v3

    # ===================== BACKEND BUILD =====================
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Build Backend
      working-directory: 02-backend/spring-boot-rest-api
      run: mvn clean package -DskipTests

    # ===================== FRONTEND BUILD =====================
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: 03-frontend/angular-ecommerce
      run: npm install

    - name: Build Angular (FIXED)
      working-directory: 03-frontend/angular-ecommerce
      run: npx ng build --configuration production

    # ===================== VERIFY OUTPUT (CRITICAL) =====================
    - name: Verify build output
      run: |
        echo "===== BACKEND TARGET ====="
        ls -R 02-backend/spring-boot-rest-api/target || true

        echo "===== FRONTEND DIST ====="
        ls -R 03-frontend/angular-ecommerce/dist || true

        echo "===== CHECK JAR ====="
        find 02-backend -name "*.jar" || true

        echo "===== CHECK ANGULAR DIST ====="
        find 03-frontend -name "index.html" || true

    # ===================== PREPARE ARTIFACTS (FIX FOR SCP) =====================
    - name: Prepare deployment folder
      run: |
        mkdir -p deploy/backend
        mkdir -p deploy/frontend

        # COPY JAR (IMPORTANT FIX)
        cp $(find 02-backend -name "*.jar" | head -n 1) deploy/backend/app.jar

        # COPY ANGULAR DIST (FIX ANGULAR OUTPUT PATH)
        cp -r 03-frontend/angular-ecommerce/dist/* deploy/frontend/

        echo "===== DEPLOY FOLDER CONTENT ====="
        ls -R deploy

    # ===================== COPY TO VM =====================
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "deploy/*"
        target: "/home/azureuser/test-deploy"

    # ===================== DEPLOY ON VM =====================
    - name: Deploy on VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |

          echo "Stopping old backend..."
          pkill -f app.jar || true

          echo "Starting backend on 8081..."
          nohup java -jar /home/azureuser/test-deploy/deploy/backend/app.jar \
          --server.port=8081 > backend.log 2>&1 &

          echo "Deploying frontend to nginx..."
          sudo rm -rf /var/www/test/*
          sudo cp -r /home/azureuser/test-deploy/deploy/frontend/* /var/www/test/

          echo "Restarting nginx..."
          sudo systemctl restart nginx

          echo "DONE ✅ Deployment successful"
