name: Test Deployment

on:
  push:
    branches:
      - test

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------- BACKEND ----------------
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Backend
      run: |
        cd "02-backend/spring-boot-rest-api"
        mvn clean package

    # ---------------- FRONTEND ----------------
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      run: |
        cd 03-frontend/angular-ecommerce
        npm install

    - name: Build Frontend
      run: |
        cd 03-frontend/angular-ecommerce
        npm run build --configuration production

    # ---------------- DEPLOY ----------------
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: |
          02-backend/spring-boot rest api/target/*.jar
          03-frontend/angular-ecommerce/dist/*
        target: /home/azureuser/test-deploy/

    - name: Deploy on VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Stop old test app
          pkill -f "test-app" || true

          # Run backend on port 8081
          nohup java -jar /home/azureuser/test-deploy/02-backend/spring-boot\ rest\ api/target/*.jar --server.port=8081 > test.log 2>&1 &

          # Deploy frontend
          sudo mkdir -p /var/www/test
          sudo rm -rf /var/www/test/*
          sudo cp -r /home/azureuser/test-deploy/03-frontend/angular-ecommerce/dist/* /var/www/test/
