name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (for backend build if needed)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Build backend (IMPORTANT)
      - name: Build Spring Boot backend
        run: |
          cd 02-backend/spring-boot-rest-api
          mvn clean package -DskipTests

      # 4. Prepare deploy folder
      - name: Prepare deploy package
        run: |
          mkdir -p deploy/backend
          mkdir -p deploy/frontend

          cp 02-backend/spring-boot-rest-api/target/*.jar deploy/backend/app.jar

          cp -r 01-frontend/angular-ecommerce deploy/frontend/

          ls -R deploy

      # 5. Copy files to VM (FIXED)
      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/*"
          target: "/home/${{ secrets.VM_USER }}/test-deploy"

      # 6. Deploy on VM
      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            echo "Stopping backend if running..."
            pkill -f app.jar || true

            echo "Starting backend..."
            nohup java -jar /home/${{ secrets.VM_USER }}/test-deploy/deploy/backend/app.jar \
              --server.port=8081 > /home/${{ secrets.VM_USER }}/backend.log 2>&1 &

            sleep 5

            echo "Checking backend..."
            curl -s http://localhost:8081/api/products || echo "Backend not responding yet"

            echo "Deploying frontend..."
            sudo mkdir -p /var/www/test
            sudo rm -rf /var/www/test/*
            sudo cp -r /home/${{ secrets.VM_USER }}/test-deploy/deploy/frontend/angular-ecommerce/* /var/www/test/

            echo "Restarting nginx..."
            sudo systemctl restart nginx

            echo "DONE ✅ Deployment successful"
