name: Build and Deploy Ecommerce App

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===================== BACKEND BUILD =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        run: |
          cd 02-backend/spring-boot-rest-api
          mvn clean package -DskipTests

      # ===================== FRONTEND BUILD =====================
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build frontend
        run: |
          cd 03-frontend/angular-ecommerce
          npm install
          npm run build -- --configuration production

      # ===================== PREPARE DEPLOY FOLDER =====================
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/backend
          mkdir -p deploy/frontend

          # backend jar
          cp 02-backend/spring-boot-rest-api/target/*.jar deploy/backend/app.jar

          # frontend build output (Angular dist)
          cp -r 03-frontend/angular-ecommerce/dist/* deploy/frontend/

      # ===================== UPLOAD TO VM =====================
      - name: Copy to VM
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/*"
          target: "/home/${{ secrets.VM_USER }}/test-deploy"

      # ===================== DEPLOY ON VM =====================
      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Stopping backend..."
            pkill -f app.jar || true

            echo "Starting backend..."
            nohup java -jar /home/${{ secrets.VM_USER }}/test-deploy/deploy/backend/app.jar \
            --server.port=8081 > backend.log 2>&1 &

            echo "Deploying frontend..."
            sudo mkdir -p /var/www/test
            sudo rm -rf /var/www/test/*
            sudo cp -r /home/${{ secrets.VM_USER }}/test-deploy/deploy/frontend/* /var/www/test/

            echo "Restarting nginx..."
            sudo systemctl restart nginx

            echo "DONE ✅ Deployment successful"
