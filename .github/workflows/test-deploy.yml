name: Test Deployment

on:
  push:
    branches:
      - test

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # ---------------- CHECKOUT ----------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------- BACKEND ----------------
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Build Backend
      working-directory: 02-backend/spring-boot-rest-api
      run: mvn clean package

    # ---------------- FRONTEND ----------------
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      working-directory: 03-frontend/angular-ecommerce
      run: npm install

    - name: Build Frontend
      working-directory: 03-frontend/angular-ecommerce
      run: npx ng build --configuration production

    # ---------------- DEPLOY TO VM ----------------
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: |
          02-backend/spring-boot-rest-api/target/*.jar
          03-frontend/angular-ecommerce/dist/angular-ecommerce/*
        target: /home/azureuser/test-deploy/

    # ---------------- RUN ON VM ----------------
    - name: Deploy on VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          echo "Stopping old backend..."
          pkill -f spring-boot || true

          echo "Starting backend..."
          nohup java -jar /home/azureuser/test-deploy/02-backend/spring-boot-rest-api/target/*.jar \
          --server.port=8081 > backend.log 2>&1 &

          echo "Deploying frontend..."
          sudo mkdir -p /var/www/test
          sudo rm -rf /var/www/test/*
          sudo cp -r /home/azureuser/test-deploy/03-frontend/angular-ecommerce/dist/angular-ecommerce/* /var/www/test/

          echo "Deployment complete"
