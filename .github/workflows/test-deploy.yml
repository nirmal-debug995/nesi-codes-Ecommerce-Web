name: Test Deployment

on:
  push:
    branches:
      - test

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

    # ---------------- CHECKOUT ----------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------- BACKEND ----------------
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Build Backend
      working-directory: 02-backend/spring-boot-rest-api
      run: mvn clean package -DskipTests

    # ---------------- FRONTEND ----------------
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      working-directory: 03-frontend/angular-ecommerce
      run: npm install

    - name: Build Frontend
      working-directory: 03-frontend/angular-ecommerce
      run: npx ng build --configuration production

    # =====================================================
    # STEP 1 — VERIFY OUTPUT BEFORE SCP
    # =====================================================
    - name: Verify build output
      run: |
        echo "===== BACKEND TARGET ====="
        ls -R 02-backend/spring-boot-rest-api/target || true

        echo "===== FRONTEND DIST ====="
        ls -R 03-frontend/angular-ecommerce/dist || true

    # =====================================================
    # STEP 2 — PREPARE CLEAN DEPLOY FOLDERS
    # =====================================================
    - name: Prepare deployment package
      run: |
        mkdir -p deploy/backend
        mkdir -p deploy/frontend

        # Copy backend jar (IMPORTANT FIX)
        cp 02-backend/spring-boot-rest-api/target/*.jar deploy/backend/app.jar

        # Copy angular build output (FIX: wildcard correct)
        cp -r 03-frontend/angular-ecommerce/dist/* deploy/frontend/

        echo "Deployment package ready:"
        ls -R deploy

    # =====================================================
    # STEP 3 — SCP (FIXED - NO EMPTY ARCHIVE ISSUE)
    # =====================================================
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "deploy/*"
        target: "/home/azureuser/test-deploy"

    # =====================================================
    # STEP 4 — DEPLOY ON VM
    # =====================================================
    - name: Deploy on VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |

          echo "Stopping backend..."
          pkill -f app.jar || true

          echo "Starting backend..."
          nohup java -jar /home/azureuser/test-deploy/deploy/backend/app.jar \
          --server.port=8081 > backend.log 2>&1 &

          echo "Deploying frontend..."
          sudo mkdir -p /var/www/test
          sudo rm -rf /var/www/test/*
          sudo cp -r /home/azureuser/test-deploy/deploy/frontend/* /var/www/test/

          echo "Restarting nginx..."
          sudo systemctl restart nginx

          echo "DONE ✅ Deployment successful"
