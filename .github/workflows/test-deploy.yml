name: Test Deployment

on:
  push:
    branches:
      - test

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

    # =====================================================
    # STEP 1 — CHECKOUT CODE
    # =====================================================
    - name: Checkout code
      uses: actions/checkout@v3

    # =====================================================
    # STEP 2 — BACKEND BUILD (MAVEN)
    # =====================================================
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: '17'

    - name: Build Backend
      working-directory: 02-backend/spring-boot-rest-api
      run: mvn clean package -DskipTests

    # =====================================================
    # STEP 3 — FRONTEND BUILD (ANGULAR)
    # =====================================================
    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      working-directory: 03-frontend/angular-ecommerce
      run: npm install

    - name: Build Frontend
      working-directory: 03-frontend/angular-ecommerce
      run: npx ng build --configuration production

    # =====================================================
    # STEP 4 — VERIFY BUILD OUTPUT (VERY IMPORTANT)
    # =====================================================
    - name: Verify Build Output
      run: |
        echo "===== BACKEND JAR ====="
        find 02-backend -type f -name "*.jar"

        echo "===== FRONTEND DIST ====="
        find 03-frontend/angular-ecommerce/dist || true

    # =====================================================
    # STEP 5 — FAIL FAST IF OUTPUT MISSING (BEST PRACTICE)
    # =====================================================
    - name: Validate artifacts
      run: |
        test -n "$(find 02-backend -name '*.jar')" || (echo "❌ Backend JAR not found" && exit 1)
        test -d 03-frontend/angular-ecommerce/dist || (echo "❌ Frontend dist not found" && exit 1)

    # =====================================================
    # STEP 6 — COPY FILES TO VM (FIXED SCP)
    # =====================================================
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}

        source: |
          02-backend/spring-boot-rest-api/target/*.jar
          03-frontend/angular-ecommerce/dist/**

        target: /home/azureuser/test-deploy/

    # =====================================================
    # STEP 7 — DEPLOY ON VM
    # =====================================================
    - name: Deploy on VM
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}

        script: |

          echo "=============================="
          echo "STOPPING OLD BACKEND"
          echo "=============================="
          pkill -f spring-boot-rest-api || true

          echo "=============================="
          echo "STARTING BACKEND (PORT 8081)"
          echo "=============================="
          nohup java -jar /home/azureuser/test-deploy/02-backend/spring-boot-rest-api/target/*.jar \
          --server.port=8081 > backend.log 2>&1 &

          echo "=============================="
          echo "DEPLOYING FRONTEND TO NGINX"
          echo "=============================="
          sudo mkdir -p /var/www/test
          sudo rm -rf /var/www/test/*

          sudo cp -r /home/azureuser/test-deploy/03-frontend/angular-ecommerce/dist/** /var/www/test/

          echo "=============================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=============================="
